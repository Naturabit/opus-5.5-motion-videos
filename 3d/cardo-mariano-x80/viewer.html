<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardo Mariano x80 3D</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg: #f4f2ee; --fg: #1c2733; --muted: #6b7480; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1b1d20; --fg: #e9e6e0; --muted: #9aa0a8; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  model-viewer { width: 100%; height: calc(100% - 44px); --poster-color: transparent; }
  footer { height: 44px; display: flex; align-items: center; justify-content: center; gap: 16px;
    color: var(--muted); padding: 0 16px; text-align: center; }
</style>
</head>
<body>
<model-viewer src="cardo-mariano-x80.glb" alt="Cardo Mariano Estado Puro, 80 cápsulas: frasco de vidrio ámbar"
  camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500" rotation-per-second="20deg"
  camera-orbit="0deg 82deg 0.34m" min-camera-orbit="auto auto 0.12m" max-camera-orbit="auto auto 0.8m"
  field-of-view="24deg" exposure="1" shadow-intensity="0.8" shadow-softness="0.9"
  environment-image="neutral" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
<footer>Drag to rotate · scroll to zoom · 64 × 112 mm</footer>
</body>
</html>
